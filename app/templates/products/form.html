{% extends "base.html" %}
{% block title %}{{ 'Editar' if product else 'Novo' }} produto | Cafeteria Control{% endblock %}
{% block content %}
<div class="page-header"><div><h1>{{ 'Editar produto' if product else 'Novo produto' }}</h1></div></div>
<form method="post" class="panel form-grid">
<label>Nome<input name="name" required value="{{ product.name if product else '' }}"></label>
<label>Categoria<select name="category_id" required>{% for category in categories %}<option value="{{ category.id }}" {% if product and product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label>
<label>Custo atual<input name="cost" inputmode="decimal" required value="{{ '%.2f'|format(product.cost) if product else '' }}"></label>
<label>Preço de venda<input name="sale_price" inputmode="decimal" required value="{{ '%.2f'|format(product.sale_price) if product else '' }}"></label>
<label>Unidade<select name="unit" required>
    <option value="un" {% if product and product.unit == 'un' %}selected{% endif %}>Unidade</option>
    <option value="g" {% if product and product.unit == 'g' %}selected{% endif %}>Gramas (g)</option>
    <option value="kg" {% if product and product.unit == 'kg' %}selected{% endif %}>Quilogramas (kg)</option>
    <option value="ml" {% if product and product.unit == 'ml' %}selected{% endif %}>Mililitros (ml)</option>
    <option value="L" {% if product and product.unit == 'L' %}selected{% endif %}>Litros (L)</option>
</select></label>
<label>Quantidade por unidade<input name="unit_quantity" inputmode="decimal" required value="{{ product.unit_quantity if product else '1' }}" placeholder="Ex: 200 para 200g"></label>
<label>Estoque mínimo<input name="min_stock" inputmode="decimal" value="{{ '%.0f'|format(product.min_stock) if product else '0' }}"></label>
{% if product %}<label class="checkbox"><input type="checkbox" name="active" {% if product.active %}checked{% endif %}> Produto ativo</label>{% endif %}
<div class="form-actions"><a class="btn" href="{{ url_for('products.index') }}">Cancelar</a><button class="btn primary" type="submit">Salvar</button></div>
</form>
{% endblock %}
