{% extends "base.html" %}
{% block title %}Ajustar estoque | Cafeteria Control{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Ajustar estoque</h1><p>Use valor positivo para entrada e negativo para saída.</p></div></div>
<form method="post" class="panel form-grid">
<label>Produto<select name="product_id" required>{% for product in products %}<option value="{{ product.id }}" {% if request.args.get('product_id')|int == product.id %}selected{% endif %}>{{ product.name }} — atual: {{ product.stock_quantity|number_format }}</option>{% endfor %}</select></label>
<label>Quantidade<input name="quantity" type="number" step="1" placeholder="Ex.: 10 ou -2" required></label>
<label>Motivo<input name="notes" placeholder="Ex.: contagem física"></label>
<div class="form-actions"><a class="btn" href="{{ url_for('stock.index') }}">Cancelar</a><button class="btn primary" type="submit">Aplicar ajuste</button></div>
</form>
{% endblock %}
